version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: sunday
      time: '00:00'
      timezone: Etc/UTC
    groups:
      workflow-dependencies:
        patterns:
          - "*"

  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: sunday
      time: '00:00'
      timezone: Etc/UTC
    groups:
      maven-dependencies:
        patterns:
          - "*"
    ignore:
      # ClassGraph 6 requires Java 25. This product's public baseline is Java 21.
      - dependency-name: "io.github.classgraph:classgraph"
        versions:
          - "[6.0.0,)"
