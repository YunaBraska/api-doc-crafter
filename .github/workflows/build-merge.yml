name: 🔄 CD · Snapshot

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      maven_central:
        description: Maven Central.
        required: true
        default: true
        type: boolean
      github_packages:
        description: GitHub Packages.
        required: true
        default: true
        type: boolean
      docker:
        description: Docker.
        required: true
        default: true
        type: boolean

permissions: {}

concurrency:
  group: build-main-${{ github.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: read
      packages: read
    uses: YunaBraska/YunaBraska/.github/workflows/wc_java_release.yml@807b79318cc6e4242e6fc6b4be358b58218d96ab
    with:

  native:
    needs:
      - release
    if: ${{ always() && !cancelled() && needs.release.result == 'success' }}
    permissions:
      contents: read
    uses: YunaBraska/YunaBraska/.github/workflows/wc_java_build_native.yml@807b79318cc6e4242e6fc6b4be358b58218d96ab
    with:
      ref: ${{ needs.release.outputs.commit_sha }}
      version: ${{ needs.release.outputs.version }}

  central:
    needs:
      - release
      - native
    if: ${{ always() && !cancelled() && needs.release.result == 'success' && needs.native.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.maven_central) }}
    permissions:
      actions: read
      contents: read
      deployments: write
      packages: read
    uses: YunaBraska/YunaBraska/.github/workflows/wc_java_publish_central.yml@807b79318cc6e4242e6fc6b4be358b58218d96ab
    secrets:
      CENTRAL_USER: ${{ secrets.CENTRAL_USER }}
      CENTRAL_PASS: ${{ secrets.CENTRAL_PASS }}
      GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  packages:
    needs:
      - release
      - native
    if: ${{ always() && !cancelled() && needs.release.result == 'success' && needs.native.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.github_packages) }}
    permissions:
      actions: read
      contents: read
      deployments: write
      packages: write
    uses: YunaBraska/YunaBraska/.github/workflows/wc_java_publish_github_packages.yml@807b79318cc6e4242e6fc6b4be358b58218d96ab

  docker:
    needs:
      - release
      - native
    if: ${{ always() && !cancelled() && needs.release.result == 'success' && needs.native.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.docker) }}
    permissions:
      actions: read
      packages: write
    uses: YunaBraska/YunaBraska/.github/workflows/wc_java_publish_docker.yml@807b79318cc6e4242e6fc6b4be358b58218d96ab
    with:
      version: ${{ needs.release.outputs.version }}
