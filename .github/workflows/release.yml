# yuna-release: true
name: 🏷️ CD · Release

on:
  workflow_dispatch:
    inputs:
      maven_central:
        description: Maven Central.
        required: true
        default: true
        type: boolean
      github_packages:
        description: GitHub Packages.
        required: true
        default: true
        type: boolean
      docker:
        description: Docker.
        required: true
        default: true
        type: boolean
      force:
        description: Force.
        required: true
        default: false
        type: boolean

permissions: {}

jobs:
  release:
    permissions:
      contents: read
    uses: YunaBraska/YunaBraska/.github/workflows/wc_java_release.yml@f6c362d9c539d7a028b816572d812e892072c50b
    with:
      force: ${{ inputs.force }}
      dry_run: ${{ inputs.maven_central != true || inputs.github_packages != true || inputs.docker != true }}

  native:
    needs:
      - release
    if: ${{ always() && !cancelled() && needs.release.result == 'success' }}
    permissions:
      contents: read
    uses: YunaBraska/YunaBraska/.github/workflows/wc_java_build_native.yml@f6c362d9c539d7a028b816572d812e892072c50b
    with:
      ref: ${{ needs.release.outputs.commit_sha }}
      version: ${{ needs.release.outputs.version }}

  central:
    needs:
      - release
      - native
    if: ${{ always() && !cancelled() && needs.release.result == 'success' && needs.native.result == 'success' && inputs.maven_central }}
    permissions:
      actions: read
      contents: read
      deployments: write
    uses: YunaBraska/YunaBraska/.github/workflows/wc_java_publish_central.yml@f6c362d9c539d7a028b816572d812e892072c50b
    secrets:
      CENTRAL_USER: ${{ secrets.CENTRAL_USER }}
      CENTRAL_PASS: ${{ secrets.CENTRAL_PASS }}
      GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  packages:
    needs:
      - release
      - native
    if: ${{ always() && !cancelled() && needs.release.result == 'success' && needs.native.result == 'success' && inputs.github_packages }}
    permissions:
      actions: read
      contents: read
      deployments: write
      packages: write
    uses: YunaBraska/YunaBraska/.github/workflows/wc_java_publish_github_packages.yml@f6c362d9c539d7a028b816572d812e892072c50b

  docker:
    needs:
      - release
      - native
    if: ${{ always() && !cancelled() && needs.release.result == 'success' && needs.native.result == 'success' && inputs.docker }}
    permissions:
      contents: read
      packages: write
    uses: YunaBraska/YunaBraska/.github/workflows/wc_java_publish_docker.yml@f6c362d9c539d7a028b816572d812e892072c50b
    with:
      ref: ${{ needs.release.outputs.commit_sha }}
      version: ${{ needs.release.outputs.version }}

  github:
    needs:
      - release
      - native
      - central
      - packages
      - docker
    if: ${{ always() && !cancelled() && needs.release.outputs.dry_run == 'false' && !endsWith(needs.release.outputs.version, '-SNAPSHOT') && needs.release.result == 'success' && needs.native.result == 'success' && needs.central.result == 'success' && needs.packages.result == 'success' && needs.docker.result == 'success' }}
    permissions:
      actions: read
      contents: write
    uses: YunaBraska/YunaBraska/.github/workflows/wc_java_create_github_release.yml@f6c362d9c539d7a028b816572d812e892072c50b
    with:
      commit_sha: ${{ needs.release.outputs.commit_sha }}
      version: ${{ needs.release.outputs.version }}
