components:
  schemas:
    Author:
      properties:
        biography:
          description: A brief biography of the author
          type: string
        birthDate:
          description: Author's date of birth
          format: date
          type: string
        id:
          type: string
        name:
          type: string
      required:
      - id
      - name
      type: object
    Book:
      properties:
        author:
          type: string
        genre:
          description: Genre of the book
          type: string
        id:
          type: string
        publishedDate:
          format: date
          type: string
        title:
          type: string
      required:
      - id
      - title
      type: object
  securitySchemes:
    api_key:
      in: header
      name: X-API-KEY
      type: apiKey
externalDocs:
  description: Find more info here
  url: https://api.books.example.com/docs
info:
  contact:
    email: support@books.example.com
    name: API Support
    url: https://api.books.example.com/support
  description: "API to manage books, authors, and their TEST_VALUE relationships."
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://api.books.example.com/terms
  title: Books API
  version: 1.0.0
openapi: 3.0.1
paths:
  /authors:
    get:
      description: Fetch a list of all authors.
      responses:
        "200":
          content:
            '*/*':
              schema:
                items:
                  $ref: "#/components/schemas/Author"
                type: array
          description: A list of authors
      summary: Retrieve all authors
      tags:
      - Authors
    post:
      description: Adds a new author to the system.
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/Author"
        required: true
      responses:
        "201":
          content: {}
          description: Author added successfully
      summary: Add a new author
      tags:
      - Authors
      x-codegen-request-body-name: body
  /books:
    get:
      description: Returns a list of all books available in the system.
      responses:
        "200":
          content:
            '*/*':
              schema:
                items:
                  $ref: "#/components/schemas/Book"
                type: array
          description: A list of books
      summary: Retrieve all books
      tags:
      - Books
    post:
      description: Adds a new book to the library.
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/Book"
        required: true
      responses:
        "201":
          content: {}
          description: Book created successfully
      summary: Add a new book
      tags:
      - Books
      x-codegen-request-body-name: body
  /books/{id}:
    delete:
      description: Deletes a specific book by its ID.
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "204":
          content: {}
          description: Book deleted successfully
      summary: Delete a book
      tags:
      - Books
    get:
      description: Fetch details of a book by its unique ID.
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Book"
          description: Book details retrieved
        "404":
          content: {}
          description: Book not found
      summary: Retrieve a specific book
      tags:
      - Books
    put:
      description: Updates information for a specific book.
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      requestBody:
        content:
          '*/*':
            schema:
              $ref: "#/components/schemas/Book"
        required: true
      responses:
        "200":
          content: {}
          description: Book updated successfully
      summary: Update a book
      tags:
      - Books
      x-codegen-request-body-name: body
servers:
- url: https://api.books.example.com/v1
tags:
- description: Operations related to books
  name: Books
- description: Operations related to authors
  name: Authors
x-original-swagger-version: "2.0"
