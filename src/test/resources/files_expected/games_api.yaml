components:
  schemas:
    Game:
      properties:
        genre:
          type: string
        id:
          type: string
        releaseDate:
          format: date
          type: string
        title:
          type: string
      type: object
info:
  description: API to manage video games and developers.
  title: Games API
  version: 1.0.0
openapi: 3.0.1
paths:
  /games:
    get:
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/Game"
                type: array
          description: A list of games
      summary: Get all games
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Game"
      responses:
        "201":
          description: Game created
      summary: Add a new game
  /games/{id}:
    get:
      parameters:
      - explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Game"
          description: Game details
      summary: Retrieve a specific game
servers:
- url: https://api.games.example.com/v1
